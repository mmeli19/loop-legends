<style>
/* Layout: engineering-notebook graph paper; one centered column of "cards on a grid sheet", exam blueprint bar as the hero */
:root{
  --paper:#f3f6fb; --grid:#dfe6f3; --sheet:#ffffff; --ink:#15213b; --muted:#5b6782;
  --line:#cfd8e8; --accent:#2c55e0; --accent-ink:#ffffff; --amber:#e89b1c;
  --good:#1f8a5b; --good-bg:#e3f4ec; --bad:#c2402f; --bad-bg:#fbe7e3;
  --d1:#7a5af5; --d2:#2c55e0; --d3:#0f9aa8; --d4:#e89b1c;
  --code-bg:#eef2fa;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1422; --grid:#18213a; --sheet:#151d30; --ink:#e7ecf6; --muted:#9aa6c2;
  --line:#26314d; --accent:#7f9cff; --accent-ink:#0e1422; --amber:#f4b648;
  --good:#4fd39a; --good-bg:#14322a; --bad:#ff8a78; --bad-bg:#3a1f1d;
  --d1:#a892ff; --d2:#7f9cff; --d3:#45cbd8; --d4:#f4b648; --code-bg:#0f172a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1422; --grid:#18213a; --sheet:#151d30; --ink:#e7ecf6; --muted:#9aa6c2;
  --line:#26314d; --accent:#7f9cff; --accent-ink:#0e1422; --amber:#f4b648;
  --good:#4fd39a; --good-bg:#14322a; --bad:#ff8a78; --bad-bg:#3a1f1d;
  --d1:#a892ff; --d2:#7f9cff; --d3:#45cbd8; --d4:#f4b648; --code-bg:#0f172a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,7vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.badge{font-family:var(--body);font-size:.4em;font-weight:700;letter-spacing:.02em;vertical-align:middle;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 12px;margin-left:4px;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{margin:0;max-width:60ch}
.blueprint{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.blueprint div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;font-weight:600;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.88rem}
.legend span{display:flex;gap:8px;align-items:center;min-width:0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.primary .muted{color:inherit;opacity:.85}
.mode b{font-family:var(--display);font-size:1.15rem}
.mode .tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
@media (max-width:460px){.modes{grid-template-columns:1fr}.legend{grid-template-columns:1fr}}

/* progress */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bar .track{grid-column:1/-1;height:8px;background:var(--code-bg);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .4s}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 6px}
.stats strong{display:block;font-family:var(--display);font-size:1.5rem}
.stats small{color:var(--muted);font-size:.75rem}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* quiz */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.85rem}
.hud .score{font-family:var(--display);font-size:1.5rem;font-weight:800}
.streak{color:var(--amber);font-weight:600}
.timer{height:6px;background:var(--code-bg);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer.low i{background:var(--bad)}
.dtag{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.qtext{font-size:1.12rem;font-weight:700;margin:6px 0 0}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;overflow-x:auto;font-family:var(--mono);font-size:.86rem;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-family:var(--mono);font-weight:600;color:var(--muted);flex:none;width:1.2em}
.choice span:last-child{min-width:0;overflow-wrap:anywhere}
.choice.right{background:var(--good-bg);border-color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice:disabled{cursor:default}
.explain{border-left:4px solid var(--good);padding:10px 14px;background:var(--good-bg);border-radius:0 10px 10px 0}
.explain.miss{border-color:var(--bad);background:var(--bad-bg)}
.explain p{margin:4px 0 0}
.qbody{display:flex;flex-direction:column;gap:14px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

/* flashcards */
.card{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.card-inner{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left}
.face.back{transform:rotateY(180deg)}
.face .term{font-family:var(--display);font-size:1.6rem;font-weight:700}
.face .hint{font-size:.8rem;color:var(--muted);font-family:var(--mono)}

.results-big{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.review .item{border-top:1px solid var(--line);padding-top:12px}
.review .item:first-child{border-top:0;padding-top:0}
.toggle{display:flex;gap:8px;align-items:center;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const DOMAINS={
  1:{name:"Technology Applications Core",short:"Tech Apps Core",pct:12.5,color:"var(--d1)"},
  2:{name:"Program Design & Development",short:"Design & Dev",pct:35,color:"var(--d2)"},
  3:{name:"Programming Language Topics",short:"Language Topics",pct:40,color:"var(--d3)"},
  4:{name:"Specialized Topics",short:"Specialized",pct:12.5,color:"var(--d4)"}
};

const Q=[
/* ---------- Domain I ---------- */
{id:"t1",d:1,q:"Which of these is NOT one of the four factors courts weigh in a fair use analysis?",c:["Purpose and character of the use","Nature of the copyrighted work","Amount of the work used","Popularity of the original author"],a:3,e:"The four factors are purpose/character, nature of the work, amount used, and effect on the market. Popularity isn't one."},
{id:"t2",d:1,q:"A student finds an image licensed CC BY-NC. What may the student do with it?",c:["Use it anywhere with no credit","Use it with attribution for noncommercial purposes","Sell it on a T-shirt with attribution","Nothing; CC images can't be reused"],a:1,e:"BY = give attribution. NC = noncommercial only."},
{id:"t3",d:1,q:"Which federal law protects the privacy of student education records?",c:["COPPA","CIPA","FERPA","HIPAA"],a:2,e:"FERPA covers education records. COPPA covers online data from kids under 13; CIPA requires internet filtering for E-rate schools."},
{id:"t4",d:1,q:"An email claims to be from the district IT office and asks students to 'verify' their passwords at a link. This is an example of:",c:["Phishing","Spoofing a firewall","Malware signature","Two-factor authentication"],a:0,e:"Phishing uses a fake trusted sender to trick people into revealing credentials."},
{id:"t5",d:1,q:"Which file format uses LOSSLESS compression?",c:["JPEG","MP3","PNG","MPEG-4 video"],a:2,e:"PNG (also GIF, FLAC, ZIP) is lossless. JPEG, MP3 and most video codecs are lossy."},
{id:"t6",d:1,q:"Which type of memory is volatile and loses its contents when power is off?",c:["ROM","RAM","SSD","Flash drive"],a:1,e:"RAM is volatile working memory. ROM, SSDs and flash keep data without power."},
{id:"t7",d:1,q:"A teacher wants a quick check of whether each student understood today's loop lesson before tomorrow. Best choice?",c:["A unit summative exam","An exit ticket with one tracing problem","A semester portfolio","A standardized benchmark"],a:1,e:"Exit tickets are fast formative assessment that inform the next day's instruction."},
{id:"t8",d:1,q:"Which is the BEST first step when judging whether a website is a credible source?",c:["Check how attractive the design is","Check the author's credentials and publication date","Count the number of ads","See if it appears first in search results"],a:1,e:"Authority and currency are core credibility checks. Search rank and design say nothing about accuracy."},
{id:"t9",d:1,q:"A district document that defines how students may and may not use school computers and networks is called a(n):",c:["Acceptable Use Policy","End User License Agreement","Service Level Agreement","Terms of copyright"],a:0,e:"An AUP sets rules for using school technology, including consequences for misuse."},
{id:"t10",d:1,q:"Everything a student posts, likes and shares online that can later be found is their:",c:["Digital footprint","Bandwidth","Metadata cache","IP address"],a:0,e:"Digital footprint is a core digital citizenship concept."},
{id:"t11",d:1,q:"Which strategy best supports English language learners in a CS class?",c:["Avoid diagrams so they focus on text","Pair vocabulary with visuals and examples, and allow partner talk","Only lecture to keep pace","Grade spelling in code comments heavily"],a:1,e:"Visuals, modeling, and structured peer talk are standard sheltered-instruction supports."},
/* ---------- Domain II ---------- */
{id:"p1",d:2,q:"A program compiles and runs but prints the wrong average because the loop skips the last element. What kind of error is this?",c:["Syntax error","Runtime error","Logic error","Compile-time type error"],a:2,e:"It runs without crashing but gives the wrong result: a logic error (here, off-by-one)."},
{id:"p2",d:2,q:"A program crashes when it divides by a user-entered value of 0. What kind of error is this?",c:["Syntax error","Runtime error","Logic error","Linker error"],a:1,e:"The code compiles, then fails while executing: a runtime error (ArithmeticException in Java)."},
{id:"p3",d:2,q:"Valid input is an integer from 1 to 100. Which set of test values best performs boundary testing?",c:["50, 51, 52","0, 1, 100, 101","1, 50, 100","-500, 500"],a:1,e:"Test just inside and just outside each boundary: 0, 1, 100, 101."},
{id:"p4",d:2,q:"Testing a function only by comparing outputs to the specification, without looking at the code, is:",c:["White-box testing","Black-box testing","Unit coverage analysis","Regression refactoring"],a:1,e:"Black-box = based on specs/inputs/outputs. White-box = based on the internal code paths."},
{id:"p5",d:2,q:"Which development model delivers working software in short, repeated iterations with frequent customer feedback?",c:["Waterfall","Agile","Big Bang","V-model"],a:1,e:"Agile (e.g., Scrum sprints) is iterative and incremental. Waterfall runs phases once in sequence."},
{id:"p6",d:2,q:"In the software development life cycle, what normally comes FIRST?",c:["Testing","Implementation (coding)","Requirements analysis","Maintenance"],a:2,e:"SDLC: requirements/analysis → design → implementation → testing → deployment → maintenance."},
{id:"p7",d:2,q:"About how many comparisons does binary search need, worst case, on a sorted list of 1,000 items?",c:["About 10","About 100","About 500","1,000"],a:0,e:"Binary search is O(log n). log₂(1000) ≈ 10."},
{id:"p8",d:2,q:"What is the Big-O time of this code?",code:"for (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        total += grid[i][j];",c:["O(n)","O(n log n)","O(n²)","O(2ⁿ)"],a:2,e:"Two nested loops that each run n times → n × n = O(n²)."},
{id:"p9",d:2,q:"Which sorting algorithm uses divide-and-conquer and runs in O(n log n) in every case?",c:["Bubble sort","Insertion sort","Merge sort","Selection sort"],a:2,e:"Merge sort splits, sorts halves recursively, and merges: O(n log n) best, average, and worst."},
{id:"p10",d:2,q:"After ONE pass of selection sort (ascending), what is [5, 2, 9, 1]?",c:["[1, 2, 9, 5]","[2, 5, 9, 1]","[2, 5, 1, 9]","[1, 2, 5, 9]"],a:0,e:"Selection sort finds the minimum (1) and swaps it into index 0: [1, 2, 9, 5]."},
{id:"p11",d:2,q:"After ONE pass of bubble sort (ascending), what is [5, 2, 9, 1]?",c:["[2, 5, 1, 9]","[1, 2, 9, 5]","[2, 5, 9, 1]","[1, 5, 2, 9]"],a:0,e:"Swap 5/2 → [2,5,9,1]; 5/9 stays; swap 9/1 → [2,5,1,9]. The largest bubbles to the end."},
{id:"p12",d:2,q:"Which data structure is best for an 'Undo' feature?",c:["Queue","Stack","Hash table","Binary search tree"],a:1,e:"Undo reverses the most recent action first: last in, first out = stack."},
{id:"p13",d:2,q:"A stack: push 1, push 2, pop, push 3, pop. What did the SECOND pop return?",c:["1","2","3","Nothing; the stack was empty"],a:2,e:"After push 1, push 2, pop (→2), push 3, the top is 3, so the second pop returns 3."},
{id:"p14",d:2,q:"Breadth-first search of a graph typically uses which structure to track nodes to visit?",c:["Stack","Queue","Priority heap only","Linked list of edges"],a:1,e:"BFS uses a FIFO queue. DFS uses a stack (or recursion)."},
{id:"p15",d:2,q:"In a UML class diagram, what does a minus sign (−) before an attribute mean?",c:["Public","Private","Protected","Static"],a:1,e:"+ public, − private, # protected; underlined = static."},
{id:"p16",d:2,q:"Breaking a large problem into smaller subproblems that are each solved separately is called:",c:["Abstraction","Decomposition","Encryption","Iteration"],a:1,e:"Decomposition (top-down design / stepwise refinement). Abstraction hides unneeded detail."},
{id:"p17",d:2,q:"Insertion sort's BEST case occurs when the input is already sorted. Its best-case time is:",c:["O(1)","O(log n)","O(n)","O(n²)"],a:2,e:"Each element is compared once and never shifted: O(n)."},
{id:"p18",d:2,q:"Average-case lookup time for a key in a well-designed hash table is:",c:["O(1)","O(log n)","O(n)","O(n log n)"],a:0,e:"Hashing jumps straight to the bucket: O(1) on average (O(n) worst case with many collisions)."},
{id:"p19",d:2,q:"A recursive method has no base case. When run, the most likely result is:",c:["It returns 0","A StackOverflowError","A syntax error","It runs once then stops"],a:1,e:"Each call adds a stack frame until the call stack runs out."},
{id:"p20",d:2,q:"In pair programming, the person typing the code is the ____ and the person reviewing and guiding is the ____.",c:["navigator, driver","driver, navigator","pilot, tester","author, scrum master"],a:1,e:"Driver types; navigator reviews and thinks ahead. Partners swap roles often."},
{id:"p21",d:2,q:"Testing that verifies separately built modules work correctly TOGETHER is:",c:["Unit testing","Integration testing","Alpha testing","Static analysis"],a:1,e:"Unit tests check one piece alone; integration tests check how pieces interact."},
{id:"p22",d:2,q:"What is the main purpose of a version control system like Git?",c:["Compile code faster","Track changes and let a team merge and roll back work","Encrypt source code","Replace testing"],a:1,e:"Version control records history, supports branching/merging, and allows reverting."},
/* ---------- Domain III ---------- */
{id:"l1",d:3,q:"What is printed? (Java)",code:"System.out.println(17 / 5 + 17 % 5);",c:["5","5.4","3","7"],a:0,e:"Integer division 17 / 5 = 3, and 17 % 5 = 2. 3 + 2 = 5."},
{id:"l2",d:3,q:"What is printed? (Java)",code:"System.out.println((double) 7 / 2);",c:["3","3.0","3.5","4"],a:2,e:"The cast applies to 7 first, so it's 7.0 / 2 = 3.5. (double)(7 / 2) would give 3.0."},
{id:"l3",d:3,q:"What is printed? (Java)",code:"String s = \"COMPUTER\";\nSystem.out.println(s.substring(2, 5));",c:["MPU","OMP","MPUT","PUT"],a:0,e:"Indexes 2, 3, 4 (end is exclusive): M P U."},
{id:"l4",d:3,q:"How many times does the loop body run?",code:"for (int i = 0; i < 10; i += 3) {\n    count++;\n}",c:["3","4","10","Infinite"],a:1,e:"i takes 0, 3, 6, 9, then 12 fails the test. Four iterations."},
{id:"l5",d:3,q:"What is printed? (Java)",code:"int[] a = {4, 8, 15, 16, 23};\nSystem.out.println(a[a.length - 2]);",c:["15","16","23","ArrayIndexOutOfBoundsException"],a:1,e:"length is 5, so a[3] = 16."},
{id:"l6",d:3,q:"What does f(5) return?",code:"int f(int n) {\n    if (n <= 1) return 1;\n    return n * f(n - 1);\n}",c:["15","25","120","720"],a:2,e:"Factorial: 5 × 4 × 3 × 2 × 1 = 120."},
{id:"l7",d:3,q:"What does mystery(482) return?",code:"int mystery(int n) {\n    if (n == 0) return 0;\n    return n % 10 + mystery(n / 10);\n}",c:["482","14","284","48"],a:1,e:"It sums the digits: 2 + 8 + 4 = 14."},
{id:"l8",d:3,q:"Which expression is equivalent to !(a && b)?",c:["!a && !b","!a || !b","a || b","!(a || b)"],a:1,e:"De Morgan's law: NOT (A AND B) = (NOT A) OR (NOT B)."},
{id:"l9",d:3,q:"What happens when x is 0?",code:"if (x != 0 && 10 / x > 1) {\n    System.out.println(\"big\");\n}",c:["Prints \"big\"","Throws ArithmeticException","Condition is false; nothing prints, no exception","Compile error"],a:2,e:"Short-circuit: x != 0 is false, so && never evaluates 10 / x."},
{id:"l10",d:3,q:"What is printed? (Java)",code:"String s1 = new String(\"hi\");\nString s2 = new String(\"hi\");\nSystem.out.println((s1 == s2) + \" \" + s1.equals(s2));",c:["true true","false true","true false","false false"],a:1,e:"== compares references (two different objects). equals compares contents."},
{id:"l11",d:3,q:"What is printed?",code:"class Animal { String speak() { return \"...\"; } }\nclass Dog extends Animal { String speak() { return \"Woof\"; } }\n\nAnimal a = new Dog();\nSystem.out.println(a.speak());",c:["...","Woof","Compile error","...Woof"],a:1,e:"Polymorphism: the overridden method of the actual object type (Dog) runs at runtime."},
{id:"l12",d:3,q:"What is printed? (Java)",code:"static void bump(int n) { n = n + 5; }\n\nint x = 10;\nbump(x);\nSystem.out.println(x);",c:["10","15","5","Compile error"],a:0,e:"Java passes a copy of a primitive. Changing n doesn't change x."},
{id:"l13",d:3,q:"What is printed? (Java)",code:"static void zero(int[] arr) { arr[0] = 0; }\n\nint[] a = {7, 8};\nzero(a);\nSystem.out.println(a[0]);",c:["7","0","8","Compile error"],a:1,e:"The reference is copied, but both point to the same array, so the change is visible."},
{id:"l14",d:3,q:"Making fields private and exposing them through getter and setter methods demonstrates:",c:["Inheritance","Polymorphism","Encapsulation","Recursion"],a:2,e:"Encapsulation hides internal data and controls access."},
{id:"l15",d:3,q:"Two methods in the same class share a name but have different parameter lists. This is:",c:["Overriding","Overloading","Shadowing","Casting"],a:1,e:"Overloading = same name, different parameters (compile-time). Overriding = subclass redefines a superclass method."},
{id:"l16",d:3,q:"A class variable declared static is:",c:["Copied separately into every object","Shared by all objects of the class","Only usable inside constructors","Automatically private"],a:1,e:"One static variable belongs to the class itself and is shared by every instance."},

/* ---------- quiz ---------- */
let S=null;
function buildRun(){
  const plan={1:2,2:4,3:4,4:2};let out=[];
  for(const d of [1,2,3,4])out=out.concat(shuffle(Q.filter(q=>q.d===d)).slice(0,plan[d]));
  return shuffle(out);
}
function startQuiz(mode,d){
  let qs;
  if(mode==="run")qs=buildRun();
  else if(mode==="domain")qs=shuffle(Q.filter(q=>q.d===d));
  else if(mode==="missed")qs=shuffle(Q.filter(q=>store.missed[q.id]));
  else if(mode==="code")qs=shuffle(Q.filter(q=>q.code)).slice(0,10);
  if(!qs.length){home();return}
  const timed=(mode==="run"||mode==="code")&&store.timer;
  S={mode,d,qs,i:0,score:0,streak:0,bestStreak:0,right:0,log:[],timed,limit:45};
  showQ();
}
function mult(){return S.streak>=5?2:S.streak>=3?1.5:1}
function showQ(){
  stopTimer();app.innerHTML="";
  const q=S.qs[S.i];const D=DOMAINS[q.d];
  const order=shuffle(q.c.map((t,i)=>({t,i})));
  const game=S.mode==="run"||S.mode==="code";
  const hud=h("div",{class:"hud"},
    h("button",{class:"btn ghost",style:"padding:8px 12px",onclick:home},"Quit"),
    h("span",{},`Q ${S.i+1} / ${S.qs.length}`),
    game?h("span",{class:"streak"},S.streak>=3?`🔥 ${S.streak} streak ×${mult()}`:`streak ${S.streak}`):h("span",{},`${S.right} correct`),
    game?h("span",{class:"score num",id:"score"},String(S.score)):null);
  const timerBar=S.timed?h("div",{class:"timer"},h("i",{id:"tb"})):null;
  const choices=h("div",{class:"choices"});
  const feedback=h("div",{});
  const keys="ABCD";
  order.forEach((o,k)=>choices.append(h("button",{class:"choice",id:"ch"+k,onclick:()=>answer(o.i,order,choices,feedback)},h("span",{class:"k"},keys[k]),h("span",{},o.t))));
  const card=h("section",{class:"sheet qbody"},
    h("span",{class:"dtag"},h("i",{class:"sw",style:`background:${D.color}`}),`Domain ${["I","II","III","IV"][q.d-1]} · ${D.short}`),
    h("p",{class:"qtext"},q.q),
    q.code?h("pre",{},h("code",{},q.code)):null,
    choices,feedback);
  app.append(hud,timerBar,card);
  if(S.timed){
    S.t0=Date.now();
    timerId=setInterval(()=>{const left=S.limit-(Date.now()-S.t0)/1000;const bar=document.getElementById("tb");
      if(bar){bar.style.width=Math.max(0,left/S.limit*100)+"%";bar.parentNode.classList.toggle("low",left<10)}
      if(left<=0){stopTimer();answer(-1,order,choices,feedback)}},100);
  }
}
function answer(pick,order,choices,feedback){
  if(S.answered===S.i)return;S.answered=S.i;stopTimer();
  const q=S.qs[S.i];const ok=pick===q.a;
  [...choices.children].forEach((b,k)=>{b.disabled=true;if(order[k].i===q.a)b.classList.add("right");else if(order[k].i===pick)b.classList.add("wrong")});
  const s=store.seen[q.id]||{c:0,t:0};s.t++;if(ok)s.c++;store.seen[q.id]=s;
  if(ok){delete store.missed[q.id]}else store.missed[q.id]=1;
  let gained=0;
  if(ok){S.right++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    const speed=S.timed?Math.max(0,1-(Date.now()-S.t0)/1000/S.limit):0;
    gained=Math.round((100+50*speed)*mult());S.score+=gained;
    const sc=document.getElementById("score");if(sc){sc.textContent=S.score;sc.classList.remove("pop");void sc.offsetWidth;sc.classList.add("pop")}}
  else S.streak=0;
  S.log.push({q,ok,pick});save();
  const msg=pick===-1?"Time's up.":ok?(gained?`Correct  +${gained}`:"Correct"):"Not quite.";
  feedback.append(h("div",{class:"explain"+(ok?"":" miss")},h("strong",{},msg),h("p",{},q.e)),
    h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"btn",id:"nextBtn",onclick:next},S.i+1<S.qs.length?"Next question →":"See results")));
  document.getElementById("nextBtn").focus({preventScroll:false});
}
function next(){S.i++;if(S.i<S.qs.length)showQ();else results()}
function results(){
  stopTimer();app.innerHTML="";
  const game=S.mode==="run"||S.mode==="code";
  let newBest=false;if(game&&S.score>store.best){store.best=S.score;newBest=true;save()}
  const pct=Math.round(S.right/S.qs.length*100);
  const verdict=pct>=85?"Test-ready on this set.":pct>=70?"Close. Review the misses below.":"Keep drilling. The explanations below are your study list.";
  const byD={};for(const l of S.log){const d=l.q.d;byD[d]=byD[d]||{c:0,t:0};byD[d].t++;if(l.ok)byD[d].c++}
  const misses=S.log.filter(l=>!l.ok);
  app.append(
    h("section",{class:"sheet",style:"display:flex;flex-direction:column;gap:12px"},
      h("div",{class:"eyebrow"},newBest?"New high score":"Round complete"),
      h("div",{class:"results-big num"},game?String(S.score):`${pct}%`),
      h("p",{style:"margin:0"},`${S.right} of ${S.qs.length} correct${game?` · ${pct}% · best streak ${S.bestStreak}`:""}. ${verdict}`),
      h("div",{class:"bars"},...Object.keys(byD).sort().map(d=>{const v=byD[d];const p=Math.round(v.c/v.t*100);
        return h("div",{class:"bar"},h("span",{},DOMAINS[d].name),h("span",{class:"num muted"},`${v.c}/${v.t}`),h("div",{class:"track"},h("div",{class:"fill",style:`width:${p}%;background:${DOMAINS[d].color}`})))})),
      h("div",{class:"row"},h("button",{class:"btn",onclick:()=>startQuiz(S.mode,S.d)},"Play again"),h("button",{class:"btn ghost",onclick:home},"Home"))),
    misses.length?h("section",{class:"sheet"},h("h2",{style:"margin-bottom:12px"},"Review your misses"),
      h("div",{class:"review"},...misses.map(l=>h("div",{class:"item"},
        h("p",{style:"margin:0 0 6px;font-weight:700"},l.q.q),
        l.q.code?h("pre",{style:"margin-bottom:8px"},h("code",{},l.q.code)):null,
        h("p",{style:"margin:0"},h("span",{class:"muted"},"Answer: "),h("strong",{},l.q.c[l.q.a])),
        h("p",{class:"muted",style:"margin:4px 0 0"},l.q.e))))):null);
}

/* ---------- flashcards ---------- */
let F=null;
function flash(d){
  stopTimer();
  const deck=shuffle(CARDS.filter(c=>!d||c.d===d));
  F={d,deck,i:0,got:0,again:[]};drawCard();
}
function drawCard(){
  app.innerHTML="";
  const chips=h("div",{class:"chips"},
    h("button",{class:"chip","aria-pressed":String(!F.d),onclick:()=>flash(0)},"All"),
    ...[1,2,3,4].map(d=>h("button",{class:"chip","aria-pressed":String(F.d===d),onclick:()=>flash(d)},DOMAINS[d].short)));
  app.append(h("div",{class:"row",style:"justify-content:space-between"},h("button",{class:"btn ghost",onclick:home},"← Back"),h("span",{class:"num muted"},`Got it ${F.got} · Again ${F.again.length}`)),chips);
  if(F.i>=F.deck.length){
    if(F.again.length){F.deck=shuffle(F.again);F.again=[];F.i=0;}
    else{app.append(h("section",{class:"sheet",style:"display:flex;flex-direction:column;gap:12px"},
      h("div",{class:"eyebrow"},"Deck cleared"),h("h2",{},"Every card marked Got it."),
      h("div",{class:"row"},h("button",{class:"btn",onclick:()=>flash(F.d)},"Shuffle again"),h("button",{class:"btn ghost",onclick:()=>startQuiz(F.d?"domain":"run",F.d)},"Test yourself"))));return}
  }
  const c=F.deck[F.i];const D=DOMAINS[c.d];
  const card=h("button",{class:"card","aria-label":"Flashcard. Tap to flip.",onclick:()=>card.classList.toggle("flipped")},
    h("div",{class:"card-inner"},
      h("div",{class:"face"},h("span",{class:"dtag"},h("i",{class:"sw",style:`background:${D.color}`}),D.short),h("div",{class:"term"},c.t),h("div",{class:"hint"},"tap to flip")),
      h("div",{class:"face back"},h("span",{class:"dtag"},h("i",{class:"sw",style:`background:${D.color}`}),c.t),h("div",{style:"font-size:1.08rem"},c.b))));
  app.append(h("div",{class:"eyebrow"},`Card ${F.i+1} of ${F.deck.length}`),card,
    h("div",{class:"row"},
      h("button",{class:"btn ghost",style:"flex:1",onclick:()=>{F.again.push(c);F.i++;drawCard()}},"Again"),
      h("button",{class:"btn",style:"flex:1",onclick:()=>{F.got++;F.i++;drawCard()}},"Got it")));
}

document.addEventListener("keydown",e=>{
  if(!S||!document.querySelector(".choice"))return;
  const k=e.key.toUpperCase();const idx="ABCD".indexOf(k);const n="1234".indexOf(e.key);const i=idx>=0?idx:n;
  if(i>=0){const b=document.getElementById("ch"+i);if(b&&!b.disabled)b.click()}
  if(e.key==="Enter"){const nb=document.getElementById("nextBtn");if(nb&&document.activeElement!==nb)nb.click()}
});

home();
</script>
