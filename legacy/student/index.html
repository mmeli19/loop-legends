<style>
/* Layout: a student's lab notebook. One column, tabbed sections (Learn / Practice / Games / Progress); highlighter marks key terms; code blocks switch between Python and Java */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#17201c; --muted:#5a6862; --line:#d6ded8;
  --accent:#0b7a63; --accent-ink:#ffffff; --hi:#ffd23f; --hi-ink:#17201c;
  --good:#1d8a4e; --good-bg:#e1f3e7; --bad:#c43f2b; --bad-bg:#fbe5e0; --code-bg:#eef2ec;
  --display:"Unbounded", "Arial Black", "Segoe UI", sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --mono:"Fira Code", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --ink:#e6eee9; --muted:#98a8a1; --line:#28362f;
  --accent:#3fd1ab; --accent-ink:#0f1513; --hi:#f5cf3a; --hi-ink:#17201c;
  --good:#5bd68e; --good-bg:#14301f; --bad:#ff8b76; --bad-bg:#3a1e19; --code-bg:#111a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --ink:#e6eee9; --muted:#98a8a1; --line:#28362f;
  --accent:#3fd1ab; --accent-ink:#0f1513; --hi:#f5cf3a; --hi-ink:#17201c;
  --good:#5bd68e; --good-bg:#14301f; --bad:#ff8b76; --bad-bg:#3a1e19; --code-bg:#111a16; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2.1rem);letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:1.2rem}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
mark{background:linear-gradient(transparent 35%,var(--hi) 35%,var(--hi) 90%,transparent 90%);color:inherit;padding:0 2px}
:root[data-theme="dark"] mark{color:var(--hi-ink);background:var(--hi);border-radius:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{color:var(--hi-ink);background:var(--hi);border-radius:3px}}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;overflow-x:auto;font-family:var(--mono);font-size:.86rem;line-height:1.6}
pre code{background:none;padding:0;font-size:inherit}
.cm{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.xp{display:flex;align-items:center;gap:10px;font-size:.85rem}
.xpbar{flex:1;height:8px;background:var(--code-bg);border-radius:4px;overflow:hidden;min-width:80px}
.xpbar i{display:block;height:100%;background:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* unit list */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.unit:hover{border-color:var(--accent)}
.unit .n{font-family:var(--display);font-weight:800;font-size:1.3rem;width:2.2ch;text-align:center;color:var(--accent)}
.unit small{display:block;color:var(--muted);font-size:.82rem}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;border:1.5px solid var(--line);color:var(--muted)}
.pill.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pill.going{background:var(--code-bg);color:var(--ink)}

/* lesson */
.lesson-sec{display:flex;flex-direction:column;gap:10px}
.lesson-sec p{max-width:66ch}
.lesson-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.codehead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:-6px;padding:0 4px}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.term b{display:block}
@media (max-width:520px){.terms{grid-template-columns:1fr}}

/* grid of tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--display);font-weight:600;font-size:1rem}
.tile .tag{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.tile.wide{grid-column:1/-1}
.tile:disabled{opacity:.5;cursor:default}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}

/* quiz */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem}
.progress{height:6px;background:var(--code-bg);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:1.1rem;font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font-family:var(--mono);font-weight:600;color:var(--muted);flex:none}
.choice span:last-child{min-width:0;overflow-wrap:anywhere}
.choice.right{background:var(--good-bg);border-color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad)}
.choice:disabled{cursor:default}
.fb{border-left:4px solid var(--good);background:var(--good-bg);border-radius:0 12px 12px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.fb.miss{border-color:var(--bad);background:var(--bad-bg)}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-family:var(--mono)}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}

/* bug hunt + code order */
.lines{display:flex;flex-direction:column;gap:4px;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.line{display:flex;gap:10px;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-family:var(--mono);font-size:.86rem;white-space:pre;min-width:max-content}
.line .ln{color:var(--muted);width:2ch;text-align:right;flex:none}
.line:hover:not(:disabled){border-color:var(--accent)}
.line.right{background:var(--good-bg);border-color:var(--good)}
.line.wrong{background:var(--bad-bg);border-color:var(--bad)}
.line:disabled{cursor:default}
.pool{display:flex;flex-direction:column;gap:6px}
.pool .line{background:var(--surface);border-color:var(--line)}
.slot{min-height:44px}
.empty{color:var(--muted);font-size:.85rem;padding:8px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mbtn{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;min-height:52px;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.mbtn.ok{background:var(--good-bg);border-color:var(--good);opacity:.6}
.mbtn.no{background:var(--bad-bg);border-color:var(--bad)}
.mbtn b{font-weight:700}

/* progress page */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:12px;padding:12px 6px}
.stats strong{display:block;font-family:var(--display);font-size:1.35rem}
.stats small{color:var(--muted);font-size:.75rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.bar .track{grid-column:1/-1;height:8px;background:var(--code-bg);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.12)}}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;font-size:.85rem}
.field input,.field select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
textarea{width:100%;font-family:var(--mono);font-size:.8rem;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:max-content}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
th button[aria-pressed="true"]{color:var(--accent)}
td.c{text-align:center;font-variant-numeric:tabular-nums}
td.hi{background:var(--good-bg);color:var(--good);font-weight:700}
td.mid{background:color-mix(in srgb,var(--hi) 28%,transparent)}
td.lo{background:var(--bad-bg);color:var(--bad)}
tr.avg td{font-weight:700;border-top:2px solid var(--line)}
.lb{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lb li{display:grid;grid-template-columns:2.6ch minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:12px}
.lb li:nth-child(-n+3){background:var(--code-bg)}
.lb .rk{font-family:var(--display);font-weight:800;color:var(--accent)}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb.huge li{font-size:clamp(1.1rem,4vw,1.7rem);padding:14px 16px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.badge{font-family:var(--body);font-size:.42em;font-weight:700;letter-spacing:.02em;vertical-align:middle;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 12px;margin-left:4px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

{id:"u1",title:"Computational Thinking",blurb:"Decompose problems and write algorithms.",
lesson:[
{h:"Thinking like a computer scientist",p:"Before writing code, programmers think through the problem. There are four big skills:",list:["<mark>Decomposition</mark>: break a big problem into smaller parts.","<mark>Pattern recognition</mark>: notice what repeats or is similar.","<mark>Abstraction</mark>: ignore details that don't matter right now.","<mark>Algorithm</mark>: write clear step-by-step instructions that always finish."]},
{h:"Pseudocode",p:"<mark>Pseudocode</mark> describes an algorithm in plain, code-like English. It isn't a real language, so anyone can read it. Here's an algorithm to find the average of test scores:",code:{all:`SET total TO 0
FOR EACH score IN scores
    ADD score TO total
END FOR
SET average TO total / COUNT(scores)
DISPLAY average`}},
{h:"Flowcharts",p:"A <mark>flowchart</mark> draws an algorithm with shapes:",list:["Oval: start or end","Rectangle: a process (do something)","Diamond: a decision (yes/no question)","Parallelogram: input or output"]},
{h:"Three control structures",p:"Every program is built from three structures: <mark>sequence</mark> (steps in order), <mark>selection</mark> (choosing with if), and <mark>iteration</mark> (repeating with loops). You'll learn each one in this course."}],
terms:[["Decomposition","Breaking a problem into smaller, manageable parts"],["Pattern recognition","Finding similarities or repeated steps"],["Abstraction","Hiding details that aren't needed to solve the problem"],["Algorithm","A precise, step-by-step set of instructions that finishes"],["Pseudocode","Plain-language description of an algorithm's steps"],["Flowchart","Diagram of an algorithm using shapes and arrows"],["Sequence","Steps run one after another, in order"],["Selection","Choosing a path based on a condition (if)"],["Iteration","Repeating steps (loops)"]],
qs:[
{id:"u1q1",q:"Planning a school dance by splitting it into music, food, and decorations is an example of:",c:["Abstraction","Decomposition","Iteration","Debugging"],a:1,e:"Splitting a big job into smaller parts is decomposition."},
{id:"u1q2",q:"In a flowchart, what does a diamond shape mean?",c:["Start or end","A process","A decision","Input or output"],a:2,e:"Diamonds ask a yes/no question and branch."},
{id:"u1q3",q:"A traffic simulation treats every car as a moving dot and ignores color and brand. This is:",c:["Abstraction","Decomposition","Selection","Pattern recognition"],a:0,e:"Abstraction removes details that don't matter for the problem."},
{id:"u1q4",q:"Which are the three basic control structures?",c:["Input, output, storage","Sequence, selection, iteration","Variables, loops, lists","Syntax, runtime, logic"],a:1,e:"Every algorithm can be built from sequence, selection, and iteration."},
{id:"u1q5",q:"Which is the best example of an algorithm?",c:["\"Make the drawing look nice.\"","\"Do some math until it feels right.\"","\"Add the two numbers, divide by 2, display the result.\"","\"Think about the problem.\""],a:2,e:"An algorithm has clear, precise steps that end."},
{id:"u1q6",q:"In a flowchart, the parallelogram shape represents:",c:["A decision","Input or output","A loop counter","The end of the program"],a:1,e:"Parallelograms are used for input (get data) and output (show data)."},
{id:"u1q7",q:"To draw a square you notice \"move forward, turn right\" happens 4 times. Noticing this is:",c:["Pattern recognition","Abstraction","Decomposition","Encryption"],a:0,e:"Spotting a repeated step is pattern recognition, and it hints you can use a loop."},
{id:"u1q8",q:"Why do programmers write pseudocode before coding?",c:["Computers run pseudocode faster","To plan the logic without worrying about syntax","It's required by every language","It replaces testing"],a:1,e:"Pseudocode lets you focus on the steps first, then translate them into a real language."}]},

{id:"u2",title:"How Computers Store Data",blurb:"Bits, bytes, binary, hex, and characters.",
lesson:[
{h:"Bits and bytes",p:"Computers store everything as <mark>bits</mark>: 0 or 1 (off or on). A group of 8 bits is a <mark>byte</mark>. With n bits you can make 2ⁿ different patterns, so one byte holds 2⁸ = 256 values (0 to 255)."},
{h:"Binary (base 2)",p:"In <mark>binary</mark>, each place is worth double the place to its right. Add the place values where there's a 1.",code:{all:`Place value:  128  64  32  16   8   4   2   1
Binary:         0   0   1   0   1   1   0   1
Decimal:     32 + 8 + 4 + 1 = 45`}},
{h:"Decimal to binary",p:"Find the biggest place value that fits, write a 1, subtract, and repeat. For 13: 8 fits (13 − 8 = 5), 4 fits (5 − 4 = 1), 2 doesn't, 1 fits. So 13 = 1101."},
{h:"Hexadecimal (base 16)",p:"<mark>Hexadecimal</mark> uses digits 0–9 and A–F (A = 10 … F = 15). Each hex digit stands for 4 bits, so it's a short way to write binary. Colors on the web use hex, like #FF0000 for red. Example: 2F = 2 × 16 + 15 = 47."},
{h:"Characters",p:"Text is stored as numbers too. <mark>ASCII</mark> gives each English character a number ('A' = 65, 'a' = 97). <mark>Unicode</mark> extends this to every language and emoji."}],
terms:[["Bit","A single 0 or 1"],["Byte","8 bits; holds values 0–255"],["Binary","Base-2 number system using only 0 and 1"],["Hexadecimal","Base-16 system using 0–9 and A–F"],["ASCII","Character code that maps English characters to numbers (A = 65)"],["Unicode","Character standard covering all languages and emoji"],["Place value","How much a digit is worth based on its position"]],
qs:[
{id:"u2q1",q:"What is binary 1011 in decimal?",c:["11","13","1011","9"],a:0,e:"8 + 0 + 2 + 1 = 11."},

{id:"u2q4",q:"What is the largest number you can store in 4 bits?",c:["4","8","15","16"],a:2,e:"1111 = 8 + 4 + 2 + 1 = 15."},

{id:"u2q9",q:"What is binary 100000 in decimal?",c:["32","16","64","100"],a:0,e:"The 1 is in the 32s place."}]},

{h:"Getting input",p:"Programs can ask the user for data.",code:{py:`name = input("Your name? ")        # always a string

print("Hi", name)`,java:`import java.util.Scanner;

{h:"Naming rules",p:"Names can't start with a digit, can't have spaces, and can't be keywords like <code>class</code>. Pick names that explain the value: <code>total_score</code> in Python or <code>totalScore</code> in Java (camelCase)."}],

{id:"u4",title:"Operators & Expressions",blurb:"Math, division rules, and order of operations.",
lesson:[
{h:"Arithmetic operators",p:"<code>+ - * /</code> work like math class. Two more matter a lot in CS: <mark>modulus</mark> <code>%</code> gives the remainder, and integer division keeps only the whole part.",code:{py:`print(17 / 5)    # 3.4  (/ always gives a decimal)
print(17 // 5)   # 3    (floor division)
print(17 % 5)    # 2    (remainder)
print(2 ** 3)    # 8    (exponent)`,java:`System.out.println(17 / 5);     // 3   (int / int drops the decimal)
System.out.println(17.0 / 5);   // 3.4
System.out.println(17 % 5);     // 2   (remainder)
System.out.println(Math.pow(2, 3));  // 8.0`}},
{h:"Order of operations",p:"Just like PEMDAS: parentheses first, then exponents, then * / // % from left to right, then + and −. So <code>2 + 3 * 4</code> is 14, but <code>(2 + 3) * 4</code> is 20."},
{h:"Why % is useful",p:"<code>n % 2 == 0</code> checks if n is even. <code>n % 10</code> gives the last digit. <code>minutes % 60</code> gives leftover minutes after hours."},
{h:"Shortcuts and conversion",p:"<mark>Compound assignment</mark> like <code>x += 3</code> means <code>x = x + 3</code>. To change a type, convert (or <mark>cast</mark>) it.",code:{py:`x = 4
x *= 3         # 12
print(int(9.99))    # 9  (drops the decimal)
print(float(7))     # 7.0
print(str(95))      # "95"`,java:`int x = 4;
x *= 3;        // 12
System.out.println((int) 9.99);   // 9  (drops the decimal)
System.out.println((double) 7);   // 7.0
x++;           // adds 1`}}],
terms:[["Modulus (%)","Gives the remainder after division"],["Integer division","Division that keeps only the whole-number part"],["Operator precedence","The order operators are evaluated (like PEMDAS)"],["Expression","A combination of values and operators that produces a value"],["Compound assignment","Shortcut like x += 3 for x = x + 3"],["Casting / conversion","Changing a value from one type to another"]],
qs:[
{id:"u4q1",q:"What is printed?",code:{py:`print(17 // 5)`,java:`System.out.println(17 / 5);`},c:["3","3.4","2","4"],a:0,e:{py:"// is floor division: 17 // 5 = 3.",java:"Both are ints, so Java drops the decimal: 3."}},
{id:"u4q2",q:"What is printed?",code:{py:`print(7 / 2)`,java:`System.out.println(7 / 2);`},c:["3","3.5","4","3.0"],a:{py:1,java:0},e:{py:"In Python, / always gives a decimal: 3.5.",java:"int / int in Java gives an int: 3. Use 7.0 / 2 to get 3.5."}},
{id:"u4q3",q:"What is 17 % 5?",c:["3","2","3.4","5"],a:1,e:"17 = 5 × 3 + 2. The remainder is 2."},
{id:"u4q4",q:"What is printed?",code:{py:`print(2 + 3 * 4)`,java:`System.out.println(2 + 3 * 4);`},c:["20","14","24","9"],a:1,e:"Multiply first: 3 × 4 = 12, then 2 + 12 = 14."},
{id:"u4q5",q:"What is printed?",code:{py:`print(10 - 4 / 2)`,java:`System.out.println(10 - 4 / 2);`},c:["3","8","8.0","3.0"],a:{py:2,java:1},e:{py:"4 / 2 = 2.0 (a float), and 10 − 2.0 = 8.0.",java:"4 / 2 = 2 (int), and 10 − 2 = 8."}},
{id:"u4q6",q:"Which condition is true only when n is even?",c:{py:["n / 2 == 0","n % 2 == 0","n % 2 == 1","n // 2 == 1"],java:["n / 2 == 0","n % 2 == 0","n % 2 == 1","n / 2 == 1"]},a:1,e:"Even numbers leave remainder 0 when divided by 2."},
{id:"u4q7",q:"What is printed?",code:{py:`print(int(9.99))`,java:`System.out.println((int) 9.99);`},c:["10","9","9.99","9.0"],a:1,e:"Converting to int chops off the decimal. It does not round."},
{id:"u4q8",q:"What is x at the end?",code:{py:`x = 4
x *= 3
x -= 2`,java:`int x = 4;
x *= 3;
x -= 2;`},c:["10","12","2","14"],a:0,e:"4 × 3 = 12, then 12 − 2 = 10."},
{id:"u4q9",q:"What is printed?",code:{py:`print(2 ** 3)`,java:`System.out.println(Math.pow(2, 3));`},c:["6","8","8.0","9"],a:{py:1,java:2},e:{py:"** is the exponent operator: 2³ = 8.",java:"Math.pow always returns a double, so it prints 8.0."}},
{id:"u4q10",q:"What is 125 % 10?",c:["12","5","12.5","25"],a:1,e:"% 10 gives the last digit of a whole number: 5."}]},

{id:"u5",title:"Strings",blurb:"Index, slice, and search text.",
lesson:[
{h:"Strings are sequences",p:"A <mark>string</mark> is a sequence of characters. Each character has an <mark>index</mark> that starts at <b>0</b>, not 1.",code:{all:`  T   E   X   A   S
  0   1   2   3   4`}},
{h:"Common string tools",p:"These are the moves you'll use most:",code:{py:`word = "TEXAS"
print(len(word))       # 5
print(word[0])         # T
print(word[1:3])       # EX   (stops before index 3)
print(word.lower())    # texas
print(word.find("A"))  # 3
print("ha" * 3)        # hahaha`,java:`String word = "TEXAS";
System.out.println(word.length());        // 5
System.out.println(word.charAt(0));       // T
System.out.println(word.substring(1, 3)); // EX  (stops before index 3)
System.out.println(word.toLowerCase());   // texas
System.out.println(word.indexOf("A"));    // 3
System.out.println("ha".repeat(3));       // hahaha`}},
{h:"Slicing rule",p:{py:"In <code>word[a:b]</code>, a is included and b is not. The slice has b − a characters. <code>word[-1]</code> is the last character.",java:"In <code>substring(a, b)</code>, a is included and b is not. The result has b − a characters. The last character is <code>word.charAt(word.length() - 1)</code>."}},
{h:"Watch out",p:{py:"You can't add a string and a number: <code>\"Score: \" + 95</code> is an error. Use <code>\"Score: \" + str(95)</code>. Compare text with <code>==</code>.",java:"Java turns numbers into text when you add them to a String: <code>\"Score: \" + 95</code> works. But compare text with <code>.equals()</code>, not <code>==</code>."}}],
terms:[["String","A sequence of characters"],["Index","The position of a character, starting at 0"],["Length","Number of characters in a string"],["Concatenation","Joining strings together with +"],["Slice / substring","A piece of a string from one index up to (not including) another"],["Immutable","Can't be changed in place; string methods return a new string"]],
qs:[
{id:"u5q1",q:"In word = \"TEXAS\", what index is the first character?",c:["0","1","-1","T"],a:0,e:"Indexes start at 0."},
{id:"u5q2",q:"What is printed?",code:{py:`word = "TEXAS"
print(word[4])`,java:`String word = "TEXAS";
System.out.println(word.charAt(4));`},c:["A","S","X","Error"],a:1,e:"T=0, E=1, X=2, A=3, S=4."},
{id:"u5q3",q:"What is printed?",code:{py:`word = "TEXAS"
print(word[1:4])`,java:`String word = "TEXAS";
System.out.println(word.substring(1, 4));`},c:["TEX","EXA","EXAS","XAS"],a:1,e:"Indexes 1, 2, 3 (stops before 4): E X A."},
{id:"u5q4",q:"What is printed?",code:{py:`print(len("TEXAS"))`,java:`System.out.println("TEXAS".length());`},c:["4","5","6","TEXAS"],a:1,e:"There are 5 characters. The last index is 4, but the length is 5."},
{id:"u5q5",q:"What is printed?",code:{py:`word = "TEXAS"
print(word.find("A"))`,java:`String word = "TEXAS";
System.out.println(word.indexOf("A"));`},c:["2","3","4","-1"],a:1,e:"The first A is at index 3. If it weren't found, you'd get -1."},
{id:"u5q6",q:"What is printed?",code:{py:`print("Score: " + 95)`,java:`System.out.println("Score: " + 95);`},c:["Score: 95","Score: + 95","An error","Score:95"],a:{py:2,java:0},e:{py:"Python won't add a str and an int. You'd need str(95). (A comma in print also works.)",java:"Java converts 95 to text when you add it to a String: Score: 95."}},
{id:"u5q7",q:"How do you check whether two strings s1 and s2 have the same text?",c:{py:["s1 == s2","s1.equals(s2)","s1 = s2","s1 is s2"],java:["s1 == s2","s1.equals(s2)","s1 = s2","s1.same(s2)"]},a:{py:0,java:1},e:{py:"In Python, == compares the text.",java:"In Java, == checks if they're the same object. Use .equals() to compare the text."}},
{id:"u5q8",q:"What happens?",code:{py:`word = "TEXAS"
print(word[5])`,java:`String word = "TEXAS";
System.out.println(word.charAt(5));`},c:["Prints S","Prints nothing","An index-out-of-range error","Prints T"],a:2,e:{py:"The last index is 4, so word[5] raises IndexError.",java:"The last index is 4, so charAt(5) throws StringIndexOutOfBoundsException."}},
{id:"u5q9",q:"Which gets the LAST character of word, whatever its length?",c:{py:["word[len(word)]","word[-1]","word[last]","word.end()"],java:["word.charAt(word.length())","word.charAt(word.length() - 1)","word.last()","word.charAt(-1)"]},a:1,e:{py:"Negative indexes count from the end: word[-1] is the last character.",java:"The last index is length − 1."}}]},

{id:"u6",title:"Making Decisions",blurb:"if, else, and Boolean logic.",
lesson:[
{h:"Comparison operators",p:"Conditions compare values and give a boolean: <code>==</code> equal, <code>!=</code> not equal, <code>&lt; &gt; &lt;= &gt;=</code>. Don't mix up <code>=</code> (store a value) and <code>==</code> (compare)."},
{h:"if / else",p:"<mark>Selection</mark> lets a program choose. Only the first true branch runs.",code:{py:`score = 85
if score >= 90:
    print("A")
elif score >= 80:
    print("B")      # this runs
elif score >= 70:
    print("C")
else:
    print("F")`,java:`int score = 85;
if (score >= 90) {
    System.out.println("A");
} else if (score >= 80) {
    System.out.println("B");   // this runs
} else if (score >= 70) {
    System.out.println("C");
} else {
    System.out.println("F");
}`},after:{py:"Python uses a colon and indentation to show what's inside each branch.",java:"Java uses parentheses around the condition and braces { } around each branch."}},
{h:"Boolean operators",p:"Combine conditions with <mark>and</mark>, <mark>or</mark>, and <mark>not</mark>.",code:{py:`age = 15
print(age >= 13 and age <= 19)   # True  (both must be true)
print(age < 5 or age > 65)       # False (at least one must be true)
print(not True)                  # False`,java:`int age = 15;
System.out.println(age >= 13 && age <= 19);  // true  (both)
System.out.println(age < 5 || age > 65);     // false (at least one)
System.out.println(!true);                   // false`}},
{h:"Order matters",p:"Check the most specific (or highest) condition first. If you test <code>score &gt;= 70</code> before <code>score &gt;= 90</code>, a 95 gets a C because the first true branch wins."}],
terms:[["Condition","An expression that is true or false"],["Selection","Choosing which code runs using if/else"],["== vs =","== compares values; = assigns a value"],["and / &&","True only if both sides are true"],["or / ||","True if at least one side is true"],["not / !","Flips true to false and false to true"],["Nested if","An if statement inside another if"]],
qs:[
{id:"u6q1",q:"What is printed when score is 85?",code:{py:`if score >= 90:
    print("A")
elif score >= 80:
    print("B")
elif score >= 70:
    print("C")
else:
    print("F")`,java:`if (score >= 90) {
    System.out.println("A");
} else if (score >= 80) {
    System.out.println("B");
} else if (score >= 70) {
    System.out.println("C");
} else {
    System.out.println("F");
}`},c:["A","B","B and C","F"],a:1,e:"85 >= 80 is the first true condition, so only B prints."},
{id:"u6q2",q:"If x is 7, what is the value of this expression?",code:{py:`x > 5 and x < 10`,java:`x > 5 && x < 10`},c:{py:["True","False","7","Error"],java:["true","false","7","Error"]},a:0,e:"7 > 5 is true and 7 < 10 is true, so both are true."},
{id:"u6q3",q:"What is the value of this expression?",code:{py:`not (3 > 1)`,java:`!(3 > 1)`},c:{py:["True","False","3","1"],java:["true","false","3","1"]},a:1,e:"3 > 1 is true, and not flips it to false."},
{id:"u6q4",q:"What's the difference between = and ==?",c:["They mean the same thing","= assigns a value; == compares two values","= compares; == assigns","== is only for strings"],a:1,e:"x = 5 stores 5. x == 5 asks \"is x equal to 5?\""},
{id:"u6q5",q:"What is printed when temp is 90? (Look closely: there are two separate ifs.)",code:{py:`if temp > 80:
    print("hot")
if temp > 40:
    print("mild")
else:
    print("cold")`,java:`if (temp > 80) {
    System.out.println("hot");
}
if (temp > 40) {
    System.out.println("mild");
} else {
    System.out.println("cold");
}`},c:["hot","hot then mild","mild","hot then cold"],a:1,e:"These are two separate if statements, so both are checked. 90 > 80 prints hot, and 90 > 40 prints mild."},
{id:"u6q6",q:"For which ages is this true?",code:{py:`age >= 13 and age <= 19`,java:`age >= 13 && age <= 19`},c:["13 through 19","14 through 18","Under 13 or over 19","Every age"],a:0,e:"Both ends are included because of >= and <=."},
{id:"u6q7",q:"When is (a or b) true?",code:{py:`a or b`,java:`a || b`},c:["Only when both are true","When at least one is true","Only when both are false","Never"],a:1,e:"or is true if either side, or both, is true."},
{id:"u6q8",q:"A student wrote this grader, and a score of 95 prints C. Why?",code:{py:`if score >= 70:
    print("C")
elif score >= 90:
    print("A")`,java:`if (score >= 70) {
    System.out.println("C");
} else if (score >= 90) {
    System.out.println("A");
}`},c:["95 is less than 70","The first true branch runs, and >= 70 is checked first","elif/else if is broken","It needs an else"],a:1,e:"Only the first true branch runs. Put the highest cutoff (90) first."}]},

{id:"u7",title:"Loops",blurb:"Repeat with for and while.",
lesson:[
{h:"Why loops?",p:"<mark>Iteration</mark> repeats code so you don't copy and paste it. Use a <mark>for loop</mark> when you know how many times to repeat, and a <mark>while loop</mark> when you repeat until something changes."},
{h:"for loops",p:"Count from a start value up to (not including) a stop value.",code:{py:`for i in range(5):         # 0, 1, 2, 3, 4
    print(i)

for i in range(2, 10, 2):  # 2, 4, 6, 8   (start, stop, step)
    print(i)

for i in range(5, 0, -1):  # 5, 4, 3, 2, 1
    print(i)`,java:`for (int i = 0; i < 5; i++) {       // 0, 1, 2, 3, 4
    System.out.println(i);
}

for (int i = 2; i < 10; i += 2) {   // 2, 4, 6, 8
    System.out.println(i);
}

for (int i = 5; i > 0; i--) {       // 5, 4, 3, 2, 1
    System.out.println(i);
}`}},
{h:"while loops",p:"A while loop keeps going as long as its condition is true. Something inside must change, or you get an <mark>infinite loop</mark>.",code:{py:`n = 3
while n > 0:
    print(n)
    n -= 1          # without this line, it never stops
print("Liftoff!")`,java:`int n = 3;
while (n > 0) {
    System.out.println(n);
    n--;            // without this line, it never stops
}
System.out.println("Liftoff!");`}},
{h:"The accumulator pattern",p:"To add things up, start a total at 0 before the loop and add to it inside the loop.",code:{py:`total = 0
for i in range(1, 5):
    total += i
print(total)     # 1 + 2 + 3 + 4 = 10`,java:`int total = 0;
for (int i = 1; i < 5; i++) {
    total += i;
}
System.out.println(total);   // 1 + 2 + 3 + 4 = 10`}},
{h:"Nested loops and break",p:"A loop inside a loop runs the inner loop completely for every pass of the outer loop. 3 outer passes × 2 inner passes = 6 runs. <code>break</code> exits a loop immediately."}],
terms:[["Iteration","Repeating a block of code"],["for loop","Repeats a set number of times (count-controlled)"],["while loop","Repeats while a condition is true (condition-controlled)"],["Infinite loop","A loop whose condition never becomes false"],["Accumulator","A variable that builds up a total inside a loop"],["Nested loop","A loop inside another loop"],["break","Exits the loop immediately"]],
qs:[
{id:"u7q1",q:"What is the LAST number printed?",code:{py:`for i in range(5):
    print(i)`,java:`for (int i = 0; i < 5; i++) {
    System.out.println(i);
}`},c:["5","4","6","0"],a:1,e:"It counts 0 to 4. It stops before 5."},
{id:"u7q2",q:"How many times does the loop run?",code:{py:`for i in range(2, 10, 2):
    print(i)`,java:`for (int i = 2; i < 10; i += 2) {
    System.out.println(i);
}`},c:["3","4","5","8"],a:1,e:"i is 2, 4, 6, 8. Four times."},
{id:"u7q3",q:"What is printed?",code:{py:`total = 0
for i in range(1, 5):
    total += i
print(total)`,java:`int total = 0;
for (int i = 1; i < 5; i++) {
    total += i;
}
System.out.println(total);`},c:["10","15","4","5"],a:0,e:"1 + 2 + 3 + 4 = 10. The loop stops before 5."},
{id:"u7q4",q:"What is n after the loop ends?",code:{py:`n = 10
while n > 0:
    n -= 3`,java:`int n = 10;
while (n > 0) {
    n -= 3;
}`},c:["1","0","-2","-3"],a:2,e:"10 → 7 → 4 → 1 → -2. Now n > 0 is false, so the loop stops."},
{id:"u7q5",q:"What usually causes an infinite while loop?",c:["Using a for loop","Forgetting to change the variable in the condition","Printing inside the loop","Using too many variables"],a:1,e:"If nothing inside the loop changes the condition, it stays true forever."},
{id:"u7q6",q:"How many stars are printed?",code:{py:`for i in range(3):
    for j in range(2):
        print("*")`,java:`for (int i = 0; i < 3; i++) {
    for (int j = 0; j < 2; j++) {
        System.out.println("*");
    }
}`},c:["5","6","3","2"],a:1,e:"The inner loop runs 2 times for each of 3 outer passes: 3 × 2 = 6."},
{id:"u7q7",q:"You want to keep asking for a password until the user types the right one. Which loop fits best?",c:["for loop","while loop","Nested for loop","No loop needed"],a:1,e:"You don't know how many tries it will take, so use a condition-controlled while loop."},
{id:"u7q8",q:"How many numbers are printed?",code:{py:`for i in range(10):
    if i == 4:
        break
    print(i)`,java:`for (int i = 0; i < 10; i++) {
    if (i == 4) {
        break;
    }
    System.out.println(i);
}`},c:["4","5","10","3"],a:0,e:"It prints 0, 1, 2, 3, then break stops the loop when i is 4."},
{id:"u7q9",q:"Which loop prints 5, 4, 3, 2, 1?",c:{py:["for i in range(5):","for i in range(5, 0, -1):","for i in range(1, 6):","for i in range(5, 0):"],java:["for (int i = 0; i < 5; i++)","for (int i = 5; i > 0; i--)","for (int i = 1; i <= 5; i++)","for (int i = 5; i < 0; i--)"]},a:1,e:{py:"Start at 5, stop before 0, step -1. range(5, 0) with no step is empty.",java:"Start at 5, keep going while i > 0, and subtract 1 each time."}}]},

{id:"u8",title:"Functions & Methods",blurb:"Reuse code with parameters and return values.",
lesson:[
{h:"What a function is",p:"A <mark>function</mark> (called a <mark>method</mark> in Java) is a named block of code you can run whenever you need it. It helps you decompose a problem and avoid repeating code."},
{h:"Parameters and return",p:"<mark>Parameters</mark> are the inputs listed in the definition. <mark>Arguments</mark> are the actual values you pass in when you call it. <code>return</code> sends a value back.",code:{py:`def area(width, height):     # width, height are parameters
    return width * height

result = area(3, 4)          # 3 and 4 are arguments
print(result)                # 12`,java:`public static int area(int width, int height) {  // parameters
    return width * height;
}

int result = area(3, 4);     // 3 and 4 are arguments
System.out.println(result);  // 12`},after:{py:"A function with no return statement gives back None.",java:"The word before the name is the return type. A method that returns nothing has return type void."}},
{h:"Return ends the function",p:"As soon as <code>return</code> runs, the function stops. Any lines after it in the same block never run."},

{id:"u10",title:"Searching & Sorting",blurb:"Find and order data efficiently.",
lesson:[
{h:"Linear search",p:"<mark>Linear search</mark> checks each item one by one until it finds the target. It works on any list, but a list of 1,000 items might take 1,000 checks.",code:{py:`def find(nums, target):
    for i in range(len(nums)):
        if nums[i] == target:
            return i
    return -1          # not found`,java:`public static int find(int[] nums, int target) {
    for (int i = 0; i < nums.length; i++) {
        if (nums[i] == target) {
            return i;
        }
    }
    return -1;         // not found
}`}},
{h:"Binary search",p:"<mark>Binary search</mark> only works on a <b>sorted</b> list. Check the middle item. If the target is smaller, throw away the right half; if bigger, the left half. Each step cuts the list in half, so 1,000 items takes about 10 checks."},
{h:"Sorting",list:["<mark>Selection sort</mark>: find the smallest item and swap it to the front. Repeat for the rest.","<mark>Bubble sort</mark>: compare neighbors and swap if they're out of order. The biggest item \"bubbles\" to the end each pass.","<mark>Insertion sort</mark>: take each item and slide it into its place in the sorted part on the left, like sorting cards in your hand."],p:"Three sorts you should know:"},
{h:"Trace it",p:"Sorting [5, 2, 9, 1] from smallest to biggest:",code:{all:`Selection, pass 1:  smallest is 1, swap with 5  →  [1, 2, 9, 5]
Bubble, pass 1:     5↔2, 5 and 9 ok, 9↔1      →  [2, 5, 1, 9]`}}],
terms:[["Linear search","Check every item in order until the target is found"],["Binary search","Repeatedly check the middle of a sorted list and discard half"],["Selection sort","Repeatedly select the smallest item and swap it into place"],["Bubble sort","Swap neighboring items that are out of order; repeat"],["Insertion sort","Insert each item into its place in the sorted section"],["Efficiency","How the work grows as the data gets bigger"]],
qs:[
{id:"u10q1",q:"What must be true about a list before you can use binary search?",c:["It has an even number of items","It is sorted","It has no duplicates","It contains only strings"],a:1,e:"Binary search depends on order to know which half to throw away."},
{id:"u10q2",q:"Worst case, how many items does linear search check in a list of 100?",c:["1","7","50","100"],a:3,e:"If the target is last (or missing), it checks all 100."},
{id:"u10q3",q:"About how many checks does binary search need for 1,000 sorted items?",c:["About 10","About 100","About 500","1,000"],a:0,e:"Halving 1,000 about 10 times gets you to 1 item."},
{id:"u10q4",q:"After ONE pass of selection sort (smallest to biggest), what is [5, 2, 9, 1]?",c:["[1, 2, 9, 5]","[2, 5, 9, 1]","[2, 5, 1, 9]","[1, 2, 5, 9]"],a:0,e:"Selection sort swaps the smallest (1) into the front."},
{id:"u10q5",q:"After ONE pass of bubble sort (smallest to biggest), what is [5, 2, 9, 1]?",c:["[2, 5, 1, 9]","[1, 2, 9, 5]","[2, 5, 9, 1]","[1, 5, 2, 9]"],a:0,e:"Swap 5 and 2, leave 5 and 9, swap 9 and 1. The biggest ends up last."},
{id:"u10q6",q:"Using the find function from the lesson, what does find([4, 9, 2, 7], 7) return?",c:["7","3","4","-1"],a:1,e:"7 is at index 3."},
{id:"u10q7",q:"Using the same find function, what does find([4, 9, 2, 7], 5) return?",c:["0","5","-1","An error"],a:2,e:"5 isn't in the list, so the loop finishes and returns -1."},
{id:"u10q8",q:"Binary search for 23 in [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]. Which item is checked FIRST? (middle index = (0 + 9) / 2, rounded down)",c:["16","23","12","38"],a:0,e:"Middle index is 4, which holds 16. 23 is bigger, so search the right half."},
{id:"u10q9",q:"Which sort works like sorting cards in your hand, sliding each new card into place?",c:["Selection sort","Bubble sort","Insertion sort","Binary sort"],a:2,e:"Insertion sort builds a sorted section by inserting one item at a time."}]},

{id:"u11",title:"Objects & Classes",blurb:"Model real things with your own types.",
lesson:[
{h:"Classes and objects",p:"A <mark>class</mark> is a blueprint. An <mark>object</mark> is one thing built from that blueprint. A class lists the data each object has (<mark>attributes</mark> or fields) and what it can do (<mark>methods</mark>)."},
{h:"A Dog class",p:"The <mark>constructor</mark> runs when you create an object and sets its starting values.",code:{py:`class Dog:
    def __init__(self, name):    # constructor
        self.name = name         # attribute
        self.tricks = 0

    def learn(self):             # method
        self.tricks += 1

rex = Dog("Rex")      # create an object
rex.learn()
print(rex.name, rex.tricks)    # Rex 1`,java:`public class Dog {
    private String name;      // fields
    private int tricks;

    public Dog(String name) { // constructor
        this.name = name;
        this.tricks = 0;
    }

    public void learn() {     // method
        tricks++;
    }

    public String getName() { return name; }
    public int getTricks() { return tricks; }
}

Dog rex = new Dog("Rex");   // create an object
rex.learn();
System.out.println(rex.getName() + " " + rex.getTricks());  // Rex 1`}},
{h:"self and this",p:{py:"<code>self</code> means \"this particular object.\" It lets each Dog keep its own name and tricks.",java:"<code>this</code> means \"this particular object.\" It tells apart the field <code>this.name</code> from the parameter <code>name</code>."}},
{h:"Encapsulation",p:"<mark>Encapsulation</mark> keeps an object's data protected and changes it only through methods. In Java, fields are <code>private</code> and you use getters and setters. In Python, a leading underscore like <code>_name</code> signals \"don't touch directly.\""}],
terms:[["Class","A blueprint that defines attributes and methods"],["Object / instance","One specific thing created from a class"],["Attribute / field","Data stored inside an object"],["Method","A function that belongs to a class"],["Constructor","Special method that sets up a new object"],["self / this","Refers to the current object"],["Encapsulation","Protecting data and accessing it through methods"]],
qs:[
{id:"u11q1",q:"Which best describes a class and an object?",c:["They're the same thing","A class is a blueprint; an object is one thing built from it","An object is a blueprint; a class is one copy","A class is a type of loop"],a:1,e:"Dog is the class. rex is an object (an instance) of Dog."},
{id:"u11q2",q:"Which method runs automatically when an object is created?",c:{py:["__init__ (the constructor)","learn","print","__main__"],java:["The constructor","main","learn","toString"]},a:0,e:"The constructor sets up the new object's starting values."},
{id:"u11q3",q:"What is printed?",code:{py:`rex = Dog("Rex")

{id:"u11q4",q:{py:"What does self refer to inside a method?",java:"What does this refer to inside a method?"},c:["The class itself","The current object","The first parameter's value","The main program"],a:1,e:"It refers to the specific object the method was called on."},
{id:"u11q5",q:"What is printed?",code:{py:`a = Dog("A")

{id:"u11q6",q:"Keeping an object's data protected and changing it only through methods is called:",c:["Inheritance","Encapsulation","Iteration","Concatenation"],a:1,e:"Encapsulation hides data behind methods like getters and setters."},
{id:"u11q7",q:"How do you create a new Dog object named Rex?",c:{py:["rex = Dog(\"Rex\")","rex = new Dog(\"Rex\")","Dog rex","rex = Dog.create(\"Rex\")"],java:["Dog rex = Dog(\"Rex\");","Dog rex = new Dog(\"Rex\");","new rex = Dog(\"Rex\");","Dog rex;"]},a:{py:0,java:1},e:{py:"Call the class like a function: Dog(\"Rex\").",java:"Use new followed by the constructor: new Dog(\"Rex\")."}}]},

{id:"u12",title:"Debugging, Testing & Ethics",blurb:"Fix errors, test well, and be a good digital citizen.",
lesson:[
{h:"Three kinds of errors",list:["<mark>Syntax error</mark>: breaks the language's grammar (missing colon, semicolon, or parenthesis). The program won't run at all.","<mark>Runtime error</mark>: the program starts but crashes, like dividing by zero or an index out of range.","<mark>Logic error</mark>: the program runs, but the answer is wrong. These are the hardest to find."],p:"Every programmer makes errors. Knowing which kind you have tells you how to find it."},
{h:"Debugging strategies",list:["Read the error message. It usually names the line.","Trace the code by hand with a <mark>trace table</mark> that lists each variable's value after each step.","Add print statements to see values while it runs.","Explain your code out loud, line by line (\"rubber duck debugging\")."]},
{h:"Testing",p:"Good <mark>test cases</mark> include normal values, edge values, and invalid values. If valid input is 1 to 100, test 50 (normal), 1 and 100 (edges), and 0 and 101 (just outside). Testing the edges is called <mark>boundary testing</mark>."},
{h:"Digital citizenship",list:["Copying someone else's code and turning it in as yours is <mark>plagiarism</mark>. Give credit, and follow the <mark>license</mark> on open-source code.","Copyright protects creative work, including code, images, and music.","Protect your privacy: don't share passwords, your address, or personal details online.","Use strong, unique passwords and turn on two-factor authentication.","Cyberbullying has real consequences. Treat people online the way you would in person."]}],
terms:[["Syntax error","Code that breaks the language's rules and won't run"],["Runtime error","An error that crashes the program while it runs"],["Logic error","The program runs but gives the wrong result"],["Trace table","A table tracking each variable's value step by step"],["Boundary testing","Testing values at and just past the edges of valid input"],["Plagiarism","Presenting someone else's work as your own"],["Open-source license","Rules for how others may use, share, and change code"],["Digital footprint","The record of everything you do and post online"]],
qs:[
{id:"u12q1",q:{py:"You forget the colon after an if statement. What kind of error is this?",java:"You forget a semicolon at the end of a line. What kind of error is this?"},c:["Syntax error","Runtime error","Logic error","Not an error"],a:0,e:"Breaking the language's grammar is a syntax error. The program won't run."},
{id:"u12q2",q:"A program crashes when the user enters 0 and the code divides by it. What kind of error is this?",c:["Syntax error","Runtime error","Logic error","Input error"],a:1,e:"It starts fine and crashes while running, so it's a runtime error."},
{id:"u12q3",q:"A program averages 3 tests but divides the total by 2. It runs fine but gives the wrong answer. What kind of error is this?",c:["Syntax error","Runtime error","Logic error","Compiler error"],a:2,e:"It runs but the result is wrong, so it's a logic error."},
{id:"u12q4",q:"Valid input is 1 to 100. Which set of tests is BEST for boundary testing?",c:["50, 51, 52","0, 1, 100, 101","1, 2, 3","-1000, 1000"],a:1,e:"Test right at each edge and just past it."},
{id:"u12q5",q:"Your friend sends you their finished program, and you change the variable names and turn it in. This is:",c:["Fine, because you changed it","Collaboration","Plagiarism","Debugging"],a:2,e:"Renaming variables doesn't make the work yours."},
{id:"u12q6",q:"Which password is strongest?",c:["password123","Your pet's name","Tr4ck!Pine#Sunset92","12345678"],a:2,e:"Long, mixed characters, and not personal or common."},
{id:"u12q7",q:"You want to use open-source code in your project. What should you do?",c:["Use it and remove the author's name","Follow its license and give credit","Only use it if nobody will notice","You can't ever use other people's code"],a:1,e:"Open-source licenses say how you may reuse the code, and they usually require credit."},
{id:"u12q8",q:"What is a trace table used for?",c:["Drawing flowcharts","Tracking each variable's value as the code runs, step by step","Storing passwords","Making the program faster"],a:1,e:"Trace tables help you find logic errors by following the code by hand."},
{id:"u12q9",q:"Which is the safest thing to post on a public profile?",c:["Your home address","Your school schedule","Your favorite programming language","Your phone number"],a:2,e:"Location, schedules, and contact info can put your safety and privacy at risk."}]}

const WORDS=["PYTHON","LAPTOP","GALAXY","PIXELS","BINARY","ROCKET","CODING","SCHOOL","TEXAS","MUSTANG"];
function gen(){
  const py=store.lang==="py";const t=pick(["div","mod","prec","vars","sum","count","idx","slice","len","ifs","dbl","list","listlast"]);
  const P=s=>py?`print(${s})`:`System.out.println(${s});`;
  let code,ans,topic;
  if(t==="div"){const a=rand(11,49),b=rand(2,7);code=py?P(`${a} // ${b}`):P(`${a} / ${b}`);ans=Math.floor(a/b);topic=py?"Floor division":"Integer division"}
  else if(t==="mod"){const a=rand(10,60),b=rand(2,9);code=P(`${a} % ${b}`);ans=a%b;topic="Modulus"}
  else if(t==="prec"){const a=rand(1,9),b=rand(2,6),c=rand(2,6);const f=pick([0,1]);code=f?P(`(${a} + ${b}) * ${c}`):P(`${a} + ${b} * ${c}`);ans=f?(a+b)*c:a+b*c;topic="Order of operations"}
  else if(t==="vars"){const a=rand(2,12),b=rand(2,9);code=py?`x = ${a}\ny = ${b}\nx = x + y\ny = x - 1\nprint(x * y)`:`int x = ${a};\nint y = ${b};\nx = x + y;\ny = x - 1;\nSystem.out.println(x * y);`;ans=(a+b)*(a+b-1);topic="Variables"}
  else if(t==="sum"||t==="count"){const st=rand(0,3),step=rand(1,3),stop=st+step*rand(2,5)+rand(0,1);let s=0,c=0;for(let i=st;i<stop;i+=step){s+=i;c++}
    const rng=step===1?(st===0?`range(${stop})`:`range(${st}, ${stop})`):`range(${st}, ${stop}, ${step})`;const inc=step===1?"i++":`i += ${step}`;
    if(t==="sum"){code=py?`total = 0\nfor i in ${rng}:\n    total += i\nprint(total)`:`int total = 0;\nfor (int i = ${st}; i < ${stop}; ${inc}) {\n    total += i;\n}\nSystem.out.println(total);`;ans=s;topic="Loops: accumulator"}
    else{code=py?`count = 0\nfor i in ${rng}:\n    count += 1\nprint(count)`:`int count = 0;\nfor (int i = ${st}; i < ${stop}; ${inc}) {\n    count++;\n}\nSystem.out.println(count);`;ans=c;topic="Loops: counting"}}
  else if(t==="idx"){const w=pick(WORDS),i=rand(0,w.length-1);code=py?`word = "${w}"\nprint(word[${i}])`:`String word = "${w}";\nSystem.out.println(word.charAt(${i}));`;ans=w[i];topic="String index"}
  else if(t==="slice"){const w=pick(WORDS),a=rand(0,3),b=Math.min(w.length,a+rand(1,3));code=py?`word = "${w}"\nprint(word[${a}:${b}])`:`String word = "${w}";\nSystem.out.println(word.substring(${a}, ${b}));`;ans=w.slice(a,b);topic=py?"String slice":"substring"}
  else if(t==="len"){const w=pick(WORDS),k=rand(1,5);code=py?`word = "${w}"\nprint(len(word) + ${k})`:`String word = "${w}";\nSystem.out.println(word.length() + ${k});`;ans=w.length+k;topic="String length"}
  else if(t==="ifs"){const x=rand(40,100);code=py?`x = ${x}\nif x >= 90:\n    print("A")\nelif x >= 80:\n    print("B")\nelif x >= 70:\n    print("C")\nelse:\n    print("F")`:`int x = ${x};\nif (x >= 90) {\n    System.out.println("A");\n} else if (x >= 80) {\n    System.out.println("B");\n} else if (x >= 70) {\n    System.out.println("C");\n} else {\n    System.out.println("F");\n}`;ans=x>=90?"A":x>=80?"B":x>=70?"C":"F";topic="if / else"}
  else if(t==="dbl"){const n0=rand(1,3),f=pick([2,3]),lim=rand(20,150);let n=n0;while(n<lim)n*=f;code=py?`n = ${n0}\nwhile n < ${lim}:\n    n *= ${f}\nprint(n)`:`int n = ${n0};\nwhile (n < ${lim}) {\n    n *= ${f};\n}\nSystem.out.println(n);`;ans=n;topic="while loops"}
  else if(t==="list"){const nums=Array.from({length:5},()=>rand(1,50)),i=rand(0,4),j=rand(0,4);code=py?`nums = [${nums.join(", ")}]\nprint(nums[${i}] + nums[${j}])`:`int[] nums = {${nums.join(", ")}};\nSystem.out.println(nums[${i}] + nums[${j}]);`;ans=nums[i]+nums[j];topic="Lists & arrays"}
  else{const nums=Array.from({length:rand(3,6)},()=>rand(1,50));code=py?`nums = [${nums.join(", ")}]\nprint(nums[-1] - nums[0])`:`int[] nums = {${nums.join(", ")}};\nSystem.out.println(nums[nums.length - 1] - nums[0]);`;ans=nums[nums.length-1]-nums[0];topic="Lists & arrays"}
  return{code,ans:String(ans),topic};
}

  app.append(h("section",{class:"card"},h("div",{class:"row between"},h("h3",{},"Leaderboard"),h("button",{class:"btn ghost small",onclick:()=>{TV.big=true;rr()}},"Big screen")),
    h("ol",{class:"lb"},...byXP.slice(0,10).map((d,i)=>h("li",{},h("span",{class:"rk"},String(i+1)),h("span",{class:"nm"},d.n+(TV.period==="all"&&d.p?` · P${d.p}`:"")),h("span",{class:"num muted"},`${d.x} XP · ${mastered(d)}/${UNITS.length}`))))));

  const avg=UNITS.map((u,i)=>{const v=rows.map(r=>r.u[i]).filter(b=>b>=0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):-1});
  const taken=avg.map((a,i)=>({a,i})).filter(o=>o.a>=0).sort((x,y)=>x.a-y.a).slice(0,3);
  const totAcc=(()=>{let a=0,c=0;rows.forEach(r=>{a+=r.a;c+=r.c});return a?Math.round(c/a*100):null})();
  app.append(h("section",{class:"card"},h("h3",{},"Class snapshot"),
    h("div",{class:"stats"},h("div",{},h("strong",{class:"num"},String(rows.length)),h("small",{},"Students")),
      h("div",{},h("strong",{class:"num"},totAcc==null?"—":totAcc+"%"),h("small",{},"Avg accuracy")),
      h("div",{},h("strong",{class:"num"},rows.length?(rows.reduce((a,r)=>a+mastered(r),0)/rows.length).toFixed(1):"0"),h("small",{},"Avg units mastered"))),
    taken.length?h("p",{},h("b",{},"Lowest unit averages: "),taken.map(o=>`Unit ${o.i+1} ${UNITS[o.i].title} (${o.a}%)`).join(" · ")):h("p",{class:"muted"},"No unit quizzes taken yet.")));

  const sortBtn=(k,label)=>h("button",{"aria-pressed":String(TV.sort===k),onclick:()=>{TV.sort=k;rr()},title:"Sort"},label);
  const table=h("table",{},
    h("thead",{},h("tr",{},h("th",{},sortBtn("n","Student")),h("th",{},"Per."),h("th",{},sortBtn("x","XP")),h("th",{},sortBtn("m","Mastered")),h("th",{},sortBtn("a","Accuracy")),
      ...UNITS.map((u,i)=>h("th",{title:u.title},`U${i+1}`)),h("th",{},"Blitz"),h("th",{},"Bugs"),h("th",{},"Updated"),h("th",{},""))),
    h("tbody",{},...rows.map(d=>{const key=d.n.toLowerCase()+"|"+(d.p||"").toLowerCase();
      return h("tr",{},h("td",{},h("b",{},d.n)),h("td",{},d.p||"—"),h("td",{class:"num"},`${d.x} · L${lvl(d.x)}`),h("td",{class:"c"},`${mastered(d)}/${UNITS.length}`),h("td",{class:"c"},acc(d)==null?"—":acc(d)+"%"),
        ...d.u.map(b=>h("td",{class:cellClass(b)},b<0?"–":String(b))),h("td",{class:"c"},String(d.g[0])),h("td",{class:"c"},`${d.g[1]}/${BUGS.length}`),
        h("td",{class:"muted"},new Date(d.ts*60000).toLocaleDateString(undefined,{month:"short",day:"numeric"})),
        h("td",{},h("button",{class:"btn ghost small",onclick:()=>{if(TV.confirmRm===key){delete T.students[key];tsave();TV.confirmRm=null}else TV.confirmRm=key;rr()}},TV.confirmRm===key?"Confirm remove":"Remove")))})),
    h("tfoot",{},h("tr",{class:"avg"},h("td",{},"Class average"),h("td",{}),h("td",{}),h("td",{}),h("td",{}),...avg.map(a=>h("td",{class:cellClass(a)},a<0?"–":String(a))),h("td",{}),h("td",{}),h("td",{}),h("td",{}))));
  const csvBtn=h("button",{class:"btn ghost small","data-label":"Copy as spreadsheet (CSV)",onclick:()=>copyText(csv(rows),csvBtn,null)},"Copy as spreadsheet (CSV)");
  app.append(h("section",{class:"card"},h("div",{class:"row between"},h("h3",{},"Scores"),csvBtn),
    h("p",{class:"muted",style:"font-size:.85rem"},"Unit cells show each student's best quiz score. Green is mastered (80%+), yellow is 50–79%, red is under 50%, and – means not taken."),
    h("div",{class:"tablewrap"},table)),
    h("section",{class:"card"},h("p",{class:"muted"},"This class list is saved only in this browser. To keep a backup, use Copy as spreadsheet and paste it into Sheets or Excel."),
      TV.confirmClear?h("div",{class:"row"},h("span",{},"Remove every student from this dashboard?"),h("button",{class:"btn",style:"background:var(--bad)",onclick:()=>{T.students={};tsave();TV.confirmClear=false;TV.msg="";rr()}},"Yes, clear"),h("button",{class:"btn ghost",onclick:()=>{TV.confirmClear=false;rr()}},"Cancel"))
      :h("div",{class:"row"},h("button",{class:"btn ghost small",onclick:()=>{TV.confirmClear=true;rr()}},"Clear class list"))));
}

/* ======================= TEACHER SIGN IN ======================= */
let teacherUnlocked=false,pinFails=0,pinWait=0,gateForgot=false;
const pinHash=p=>fnv("cs1q-pin|"+p);
function pinInput(id,label,auto){return h("label",{class:"field",style:"max-width:260px"},label,h("input",{id,type:"password",inputmode:"numeric",pattern:"[0-9]*",maxlength:"8",autocomplete:auto}))}
function teacherGate(){
  if(teacherUnlocked){teacherView();return}
  const msg=h("p",{role:"status",style:"color:var(--bad);min-height:1.4em"});
  app.append(h("div",{class:"row between"},backBtn("← Back"),h("span",{class:"eyebrow"},"Teacher sign in")));
  if(!T.pin){
    const a=pinInput("pin-new","Create a PIN (4–8 digits)","new-password"),b=pinInput("pin-confirm","Type it again","new-password");
    app.append(h("section",{class:"card"},h("h2",{},"Set up teacher mode"),
      h("p",{},"Teacher mode opens the Class Dashboard, where you paste student score codes and see the leaderboard and score table."),
      h("p",{class:"muted"},"Your PIN keeps students out of the dashboard on this device. Use one your students don't know."),
      h("form",{style:"display:flex;flex-direction:column;gap:12px",onsubmit:e=>{e.preventDefault();
        const p1=a.querySelector("input").value.trim(),p2=b.querySelector("input").value.trim();
        if(!/^\d{4,8}$/.test(p1)){msg.textContent="Use 4 to 8 digits, numbers only.";return}
        if(p1!==p2){msg.textContent="The two PINs don't match. Type them again.";return}
        T.pin=pinHash(p1);tsave();teacherUnlocked=true;go(teacherView)}},
        a,b,msg,h("div",{class:"row"},h("button",{class:"btn",type:"submit"},"Create PIN and open dashboard")))));
    setTimeout(()=>{const i=document.getElementById("pin-new");if(i)i.focus()},30);
  }else if(gateForgot){
    app.append(h("section",{class:"card"},h("h2",{},"Reset teacher mode?"),
      h("p",{},"This removes the PIN and erases the class list saved on this device. Students would need to send their score codes again."),
      h("div",{class:"row"},h("button",{class:"btn",style:"background:var(--bad)",onclick:()=>{T={students:{}};tsave();gateForgot=false;TV.msg="";go(teacherGate)}},"Erase and reset"),
        h("button",{class:"btn ghost",onclick:()=>{gateForgot=false;go(teacherGate)}},"Cancel"))));
  }else{
    const a=pinInput("pin-enter","Teacher PIN","current-password");
    app.append(h("section",{class:"card"},h("h2",{},"Enter your teacher PIN"),
      h("form",{style:"display:flex;flex-direction:column;gap:12px",onsubmit:e=>{e.preventDefault();const inp=a.querySelector("input");
        const wait=Math.ceil((pinWait-Date.now())/1000);if(wait>0){msg.textContent=`Too many tries. Wait ${wait} seconds.`;return}
        if(pinHash(inp.value.trim())===T.pin){pinFails=0;teacherUnlocked=true;go(teacherView);return}
        pinFails++;inp.value="";inp.focus();
        if(pinFails>=5){pinFails=0;pinWait=Date.now()+30000;msg.textContent="Too many tries. Wait 30 seconds."}else msg.textContent="That PIN isn't right."}},
        a,msg,h("div",{class:"row"},h("button",{class:"btn",type:"submit"},"Open dashboard"),h("button",{class:"linkbtn",type:"button",onclick:()=>{gateForgot=true;go(teacherGate)}},"Forgot PIN?")))));
    setTimeout(()=>{const i=document.getElementById("pin-enter");if(i)i.focus()},30);
  }
}

if(location.hash==="#teacher"){tab="progress";view=teacherGate}
render();
</script>
